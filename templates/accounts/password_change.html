{% extends 'base.html' %}{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><h1>Change password</h1></div>
<div class="card form-card">
  <form method="post">{% csrf_token %}{% include 'partials/_form_errors.html' %}
    {% for field in form %}{% include 'partials/_field.html' %}{% endfor %}
    <div class="form-actions"><button class="btn" type="submit">Change password</button><a class="btn btn-ghost" href="{% url 'accounts:profile' %}">Cancel</a></div>
  </form>
</div>
{% endblock %}
